# Temporary: why a dart build cli bundle cannot resolve its native library
# on Windows. Removed once the cause is known.
name: Diagnose Windows bundle

on:
  push:
    branches: [feat/v0.3-db-dsl]

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart --version
      - run: dart pub get
      - name: JIT
        shell: bash
        run: dart run tool/diagnose/native_calls.dart "$RUNNER_TEMP"
      - name: Bundle
        shell: bash
        run: |
          dart build cli -t tool/diagnose/native_calls.dart -o build/diag --verbose 2>&1 | grep -iE "asset|dll|link|hook|warning|error" | tail -40
          find build/diag -type f | sed 's/^/  /'
          find .dart_tool -iname "*native_assets*" -o -iname "*.dll" | sed 's/^/  /'
      - name: Run the bundle
        shell: bash
        run: build/diag/bundle/bin/native_calls.exe "$RUNNER_TEMP"
      - name: Run the bundle from its own directory
        shell: bash
        run: cd build/diag/bundle/bin && ./native_calls.exe "$RUNNER_TEMP"
