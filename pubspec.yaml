name: dart_db
description: "Embedded database for Dart servers: tables from your own models, Diesel-style queries, joins and transactions (db_dsl) on Rust and LMDB 1.0, for Linux, macOS and Windows."
version: 0.3.4
repository: https://github.com/JhonaCodes/dart_db
issue_tracker: https://github.com/JhonaCodes/dart_db/issues

topics:
  - server
  - backend
  - database
  - lmdb
  - query-builder

# The build hook (hook/build.dart) bundles the native library of the server
# platform; dart_db is not meant for mobile apps (use flutter_local_db).
platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ">=1.0.0 <3.0.0"
  # The query language and its runtime.
  db_dsl: ^0.2.4
  ffi: ^2.2.0
  hooks: ">=1.0.0 <3.0.0"
  result_controller: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
